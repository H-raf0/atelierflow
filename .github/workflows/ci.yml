name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — build, tests (Testcontainers), coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # unit, MockMvc, Testcontainers (Docker is available on the runner), ArchUnit; JaCoCo gate ≥ 80 %
      - name: Build and test
        run: ./mvnw -B verify
      - name: Coverage summary
        if: always()
        run: |
          awk -F, 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7} END {
            printf "### Backend coverage (JaCoCo)\n\n| Lines | Branches |\n|---|---|\n| %.1f %% | %.1f %% |\n",
              100*lc/(lc+lm), 100*bc/(bc+bm) }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
      # the frontend client is generated from this contract: fail if it was not regenerated
      - name: OpenAPI contract is in sync with the frontend
        run: diff -q target/openapi.json ../frontend/openapi.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/target/site/jacoco

  frontend:
    name: Frontend — unit tests, coverage, production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests (Vitest) with coverage
        run: npm run test:ci
      - name: Coverage summary
        if: always()
        run: |
          node -e "
            const t = require('./coverage/frontend/coverage-summary.json').total;
            console.log('### Frontend coverage (Vitest)\n\n| Lines | Branches |\n|---|---|\n| ' + t.lines.pct + ' % | ' + t.branches.pct + ' % |');
          " >> "$GITHUB_STEP_SUMMARY"
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage

  e2e:
    name: Docker images + Playwright end-to-end
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the images and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      # the official image ships Chromium and its system libraries: no apt install on the runner
      - name: Run the journeys
        run: >
          docker run --rm --network host --ipc host -e CI=true
          -v "$PWD/e2e:/e2e" -w /e2e
          mcr.microsoft.com/playwright:v1.65.0-noble
          sh -c "npm ci && npx playwright test --project=e2e"
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
