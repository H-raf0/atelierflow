# Test-only settings. Spring Boot loads classpath:/config/application.properties on top of
# classpath:/application.yml, so these values only override what tests need.

# Test-only signing key (Base64 of 32 bytes). Real deployments inject JWT_SECRET.
atelierflow.security.jwt-secret=dGVzdC1vbmx5LWtleS1mb3ItYXRlbGllcmZsb3ctMDEyMzQ1Njc4OQ==
atelierflow.security.refresh-cookie-secure=false

# Background jobs would interfere with test data; jobs are tested by calling the services directly.
atelierflow.scheduling.enabled=false

# Lets tests count SQL statements (N+1 detection).
spring.jpa.properties.hibernate.generate_statistics=true
