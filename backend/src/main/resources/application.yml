spring:
  application:
    name: atelierflow
  datasource:
    # Defaults target a local PostgreSQL; override with environment variables (docker compose does).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/atelierflow}
    username: ${DB_USER:atelierflow}
    password: ${DB_PASSWORD:}
  jpa:
    # Never open a session for the whole HTTP request: lazy loading outside services must fail fast.
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway; Hibernate only checks that the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
