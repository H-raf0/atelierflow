spring:
  application:
    name: atelierflow
  datasource:
    # Defaults target a local PostgreSQL; override with environment variables (docker compose does).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/atelierflow}
    username: ${DB_USER:atelierflow}
    password: ${DB_PASSWORD:}
  jpa:
    # Never open a session for the whole HTTP request: lazy loading outside services must fail fast.
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway; Hibernate only checks that the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        max-page-size: 100

atelierflow:
  security:
    # Mandatory, no default: the application refuses to start without a signing key.
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  # without these, responses are documented as */* and generated clients read them as binary
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  api-docs:
    # OpenAPI 3.0: its "nullable" keyword is what the TypeScript client generator understands best
    version: openapi_3_0
  swagger-ui:
    path: /swagger-ui.html
