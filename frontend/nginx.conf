# The SPA and the API are served under the same origin: no CORS needed, and the refresh cookie
# (SameSite=Strict, Path=/api/auth) is sent normally.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # REST API and OpenAPI documentation
    location ~ ^/(api|v3/api-docs|swagger-ui)(/|\.html|$) {
        proxy_pass http://backend:8080;
        # $http_host keeps the port: the backend builds Location headers and checks the
        # WebSocket Origin against it
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # STOMP over WebSocket: the connection must be upgraded and kept open
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }

    # Hashed bundles never change: cache them for a year
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Client-side routes (/board, /work-orders/42…) all serve the SPA
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
}
